dataset:
  name: 360DVO
  local_root: data/360DVO
  source_repo: chris1004336379/360DVO
  repo_type: dataset
  do_not_commit_raw_data: true
  image_type: ERP

current_dset2:
  checkpoint: checkpoints/DSET2_360DVO_fuller_split_expansion.json
  manifest_dir: external_baselines/results/dset2_360dvo_fuller_split
  existing_sequences:
    - bridge_night
    - canyon_line
    - city_driving
    - dragon_boat
    - field
    - hongkong_central
    - mountains
    - wingsuit

download:
  target_total_sequences: 12
  min_total_sequences: 10
  max_total_sequences: 14
  max_download_bytes: 12884901888
  max_files_per_sequence: 1200
  avoid_full_dataset_download_if_possible: true
  download_to: data/360DVO
  preserve_hf_structure: true

target:
  min_train_pairs: 2000
  min_val_pairs: 300
  min_test_pairs: 300
  min_adjacent_pairs_train: 400
  min_adjacent_pairs_val: 80
  min_adjacent_pairs_test: 80

split:
  split_by_sequence: true
  forbid_random_pair_split: true
  train_ratio_by_sequence: 0.7
  val_ratio_by_sequence: 0.15
  test_ratio_by_sequence: 0.15
  min_train_sequences: 7
  min_val_sequences: 2
  min_test_sequences: 2

pair_manifest:
  pair_types:
    - adjacent
    - kstep
  k_values: [1, 2, 3, 5]
  output_convention:
    R_BA: true
    t_BA_B: true
    tdir_frame: B

evaluation:
  no_training: true
  no_finetune: true
  no_gt_calibration: true
