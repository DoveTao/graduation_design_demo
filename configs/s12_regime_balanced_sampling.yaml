name: S12_regime_balanced_sampling_and_cv_redesign
base_checkpoint: checkpoints/T57b_no_dt_multiscale_tmag_head_400/final.pt
locked_s5_metrics:
  drift: 1.327343
  ATE: 7.352288
  path_ratio: 0.932379
launch_defaults:
  mode: cv
  max_steps: 100
  train_cv_groups:
    - scene01/seq01
    - scene01/seq02
  k_list:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
core_constraints:
  no_residual_pose_head: true
  no_delta_rot_tdir_training: true
  no_router_or_smoother: true
  no_test_set_sampler_design: true
  no_gt_tmag_inference_feature: true
candidate_samplers:
  - name: A_baseline_uniform_sampling
    family: baseline_uniform_sampling
    notes: original uniform pair list without rebalance
  - name: B_pred_tmag_balanced_sampling
    family: pred_tmag_balanced_sampling
    notes: balances train rows by predicted tmag quantile buckets
  - name: C_gt_tmag_balanced_sampling
    family: gt_tmag_balanced_sampling
    notes: balances train rows by gt_tmag quantile buckets, train-only
  - name: D_dt_k_balanced_sampling
    family: dt_k_balanced_sampling
    notes: balances train rows by dt x k buckets
  - name: E_hard_regime_oversampling
    family: hard_regime_oversampling
    notes: upweights pred_q90 and dt>=1.0,k=20 rows
  - name: F_mixed_balanced_sampling
    family: mixed_balanced_sampling
    notes: capped combination of tmag and dt-k balancing
lightweight_cv_subset:
  - A_baseline_uniform_sampling
  - D_dt_k_balanced_sampling
  - E_hard_regime_oversampling
  - F_mixed_balanced_sampling
