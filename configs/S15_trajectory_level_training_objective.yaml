name: S15_trajectory_level_training_objective
base_checkpoint: checkpoints/T57b_no_dt_multiscale_tmag_head_400/final.pt
locked_s5_metrics:
  drift: 1.327343
  ATE: 7.352288
  path_ratio: 0.932379
launch_defaults:
  mode: cv
  smoke_steps: 20
  cv_steps: 100
  window_size: 3
  batch_size: 1
core_constraints:
  no_residual_pose_head: true
  no_router_smoother_sampling_pose_graph_tweak: true
  no_test_selection: true
  no_gt_inference_features: true
candidates:
  - name: A_pair_only_baseline
    trainable_mode: tmag_head_only
    notes: pair-level anchor losses only
  - name: B_pair_plus_ate_path
    trainable_mode: tmag_head_only
    notes: pair-level anchor plus local trajectory ate/path proxy
  - name: C_pair_plus_rot_tdir_traj
    trainable_mode: fine_pose_light
    notes: pair-level anchor plus composed rotation and trajectory direction consistency
  - name: D_full_light_traj
    trainable_mode: fine_pose_light
    notes: lightweight full triplet-window trajectory objective
