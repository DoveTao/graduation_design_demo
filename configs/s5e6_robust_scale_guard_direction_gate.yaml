experiment: S5E6_robust_scale_guard_direction_gate_candidate
status:
  experimental_candidate: true
  not_official_replacement: true
  official_s5_locked_metrics_unchanged: true

outputs:
  checkpoint_json: checkpoints/S5E6_robust_scale_guard_direction_gate_candidate.json
  report_main: reports/s5e6_robust_scale_guard_report.md
  report_comparison: reports/s5e6_s5e5_s5e4_s5e3_s5e2_orbslam3_comparison.md
  result_dir: external_baselines/results/s5e6_traceable_dense
  trajectory_path: external_baselines/results/s5e6_traceable_dense/scene01_seq03_s5e6_traceable_dense_tum.txt
  provenance_path: external_baselines/results/s5e6_traceable_dense/edge_provenance.jsonl
  metrics_path: external_baselines/results/s5e6_traceable_dense/edge_component_metrics.json
  audit_path: external_baselines/results/s5e6_traceable_dense/tmag_outlier_audit.json

data:
  data_root: data
  split_by: scene_seq
  train_ratio: 0.8
  split_seed: 3407
  train_sequences: [scene01/seq01, scene01/seq02]
  eval_sequence: scene01/seq03
  uses_scene01_seq03_for_training: false
  no_gt_leakage: true
  no_restored_dense_artifact_for_prediction: true
  no_orbslam3_distillation: true

model:
  model_type: robust_scale_guard_direction_gate
  direction_source: s5e4_signed_direction_prior
  magnitude_source: s5e5_temporal_visual_raw_logmag
  train_split_magnitude_guard: true
  bounded_log_magnitude: true

losses:
  so3_geodesic: true
  signed_tdir: true
  tdir_abs_aux: true
  anti_parallel_penalty: true
  robust_tmag_log: true
  tmag_p95_penalty: true
  path_length_consistency: true
  short_window_direction_consistency: true
  smoothness: true

caveats:
  - S5E6 is experimental and does not replace official S5 locked result.
  - S5 locked metrics/policy unchanged.
  - scene01/seq03 GT is used only for evaluation / diagnostics.
  - No restored dense artifact is used to generate prediction.
  - ORB-SLAM3 trajectory is not used as a training label.

references:
  s5e5_path_ratio: 6.591091747656769
  s5e5_tmag_p95_ratio: 95.44378091660477
  s5e4_path_ratio: 2.1345479454214416
  s5e4_tmag_median_ratio: 12.109093390318423
  orbslam3_se3_ate: 0.30854441069248173
  orbslam3_sim3_ate: 0.224292165986624

allowed_final_classifications:
  - S5E6_GEOMETRY_IMPROVED
  - S5E6_PATH_EXPLOSION_FIXED_TDIR_STILL_BAD
  - S5E6_TMAG_GUARD_WORKED_ATE_STILL_BAD
  - S5E6_TRACEABLE_DENSE_EXPORTED_NO_IMPROVEMENT
  - S5E6_TRAINING_BLOCKED
  - S5E6_EXPORT_BLOCKED
  - S5E6_ERROR
