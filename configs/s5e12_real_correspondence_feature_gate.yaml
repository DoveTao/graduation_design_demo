experiment: S5E12_real_correspondence_feature_gate
report_language: zh
scene: scene01
seq: seq03
timestamps: external_baselines/dataset/scene01_seq03/timestamps.txt
groundtruth: external_baselines/dataset/scene01_seq03/groundtruth_tum.txt
camera_intrinsics_path: external_baselines/dataset/scene01_seq03/camera.yaml
output_dir: external_baselines/results/s5e12_feature_gate
dependency_json: external_baselines/results/s5e12_feature_gate/dependency_check.json
correspondence_json: external_baselines/results/s5e12_feature_gate/correspondence_features.json
correspondence_csv: external_baselines/results/s5e12_feature_gate/correspondence_features.csv
correspondence_quality_json: external_baselines/results/s5e12_feature_gate/correspondence_quality_audit.json
essential_audit_json: external_baselines/results/s5e12_feature_gate/essential_geometry_audit.json
observability_json: external_baselines/results/s5e12_feature_gate/observability_gate.json
checkpoint_json: checkpoints/S5E12_real_correspondence_feature_gate_candidate.json
training_status_json: checkpoints/S5E12_real_correspondence_feature_gate_candidate/training_status.json
report_md: reports/s5e12_real_correspondence_feature_gate_report.md
comparison_md: reports/s5e12_s5e11_s5e10_s5e9_s5e8_s5e7_s5e6_s5e5_s5e4_s5e3_s5e2_orbslam3_comparison.md

detector:
  type: ORB
  nfeatures: 1200
  fastThreshold: 12

matcher:
  type: BFMatcher
  norm: Hamming
  ratio_test: 0.75
  cross_check: false

flow:
  enabled: true
  max_corners: 600
  quality_level: 0.01
  min_distance: 7
  win_size: 21
  max_level: 3

image:
  resized_width: 640
  resized_height: 320

observability:
  min_filtered_matches: 12
  min_inlier_matches: 8
  min_inlier_ratio: 0.20
  low_parallax_displacement: 2.0
  near_static_displacement: 0.75
  near_static_image_diff_mean: 0.02
  large_motion_gt_quantile: 0.75
  small_motion_gt_quantile: 0.25

caveats:
  - S5E12 是 feature gate，不替代 official S5 locked result。
  - strict essential geometry 需要可信 pinhole intrinsics；当前缺失时必须显式标记 unavailable。
