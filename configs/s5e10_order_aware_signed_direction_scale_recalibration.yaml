experiment: S5E10_order_aware_signed_direction_scale_recalibration
status:
  experimental_candidate: true
  not_official_replacement: true
  official_s5_locked_metrics_unchanged: true

outputs:
  checkpoint_json: checkpoints/S5E10_order_aware_signed_direction_scale_recalibration_candidate.json
  report_main: reports/s5e10_order_aware_signed_direction_scale_recalibration_report.md
  report_comparison: reports/s5e10_s5e9_s5e8_s5e7_s5e6_s5e5_s5e4_s5e3_s5e2_orbslam3_comparison.md
  result_dir: external_baselines/results/s5e10_traceable_dense

data:
  uses_scene01_seq03_for_training: false
  no_gt_leakage: true
  no_restored_dense_artifact_for_prediction: true
  no_orbslam3_distillation: true

model:
  order_aware_signed_direction_candidate: true
  scale_recalibrated_candidate: true
  combined_order_scale_candidate: true
  order_aware_feature_representation: true
  reversed_pair_training: true
  signed_direction_reliability_mask: true
  axis_sign_decomposition: "axis + sign"
  tight_bounded_log_scale_residual: true
  log_scale_clip: 1.3862943611198906
  raw_vs_guarded_reporting: true

report_language:
  human_readable_default: 中文

allowed_final_classifications:
  - S5E10_ORDER_INVARIANT_BUG_FOUND
  - S5E10_PAIR_ORDER_OBSERVABLE
  - S5E10_SIGNED_DIRECTION_IMPROVED
  - S5E10_SCALE_RECALIBRATED
  - S5E10_SMALL_MOTION_IMPROVED
  - S5E10_RAW_GEOMETRY_IMPROVED
  - S5E10_GUARD_DEPENDENT
  - S5E10_INPUT_GEOMETRY_INSUFFICIENT
  - S5E10_NO_IMPROVEMENT
  - S5E10_REGRESSION

caveats:
  - S5E10 是 experimental，不替换 official S5 locked result。
  - 只有 raw signed direction 和 raw scale/path 同时改善，且 raw vs guarded gap 保持很小，才可视为真实几何改善。
