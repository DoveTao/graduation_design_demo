task_name: STRUCT360C_train_rotation_aware_fine_refinement
dry_run: false

prechecks:
  expected_branches:
    - experiment/seq360a-sequence-consistency-scale-drift-stabilization
    - experiment/dev360-prepare-next-model-variants-no-training
    - experiment/struct360c-train-rotation-aware-fine-refinement
  min_disk_free_gb: 5.0
  required_env: pytorch

inputs:
  init_checkpoint: checkpoints/FINAL360I_struct360b_final/seed0/best_val.pt
  struct360b_checkpoint: checkpoints/STRUCT360B_match_free_coarse_to_fine/best_val.pt
  seq360b_checkpoint: checkpoints/SEQ360B_lightweight_scale_smoothing/best_val.pt
  seq360a_checkpoint: checkpoints/SEQ360A_sequence_consistency_scale_drift/best_val.pt
  train_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_train.jsonl
  val_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_val.jsonl
  test_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_test.jsonl
  hygiene_json: checkpoints/DSET2C_360DVO_dataset_hygiene.json
  dataset_adapter: datasets/dset2c_manifest_dataset.py
  sequence_clip_dataset: datasets/dset2c_sequence_clip_dataset.py
  final360i_val_metrics: reports/FINAL360I_metrics_val.json
  final360i_test_metrics: reports/FINAL360I_metrics_test.json
  struct360b_val_metrics: reports/STRUCT360B_metrics_val.json
  struct360b_test_metrics: reports/STRUCT360B_metrics_test.json
  seq360a_val_metrics: reports/SEQ360A_metrics_val.json
  seq360a_test_metrics: reports/SEQ360A_metrics_test.json
  seq360a_traj_val_metrics: reports/SEQ360A_trajectory_metrics_val.json
  seq360a_traj_test_metrics: reports/SEQ360A_trajectory_metrics_test.json
  train360e_val_metrics: reports/TRAIN360E_metrics_val.json
  train360e_test_metrics: reports/TRAIN360E_metrics_test.json
  base360_val_metrics: reports/BASE360_metrics_val.json
  base360_test_metrics: reports/BASE360_metrics_test.json

outputs:
  checkpoint_dir: checkpoints/STRUCT360C_rotation_aware_fine_refinement
  report_path: reports/STRUCT360C_rotation_aware_fine_refinement.md
  val_metrics_path: reports/STRUCT360C_metrics_val.json
  test_metrics_path: reports/STRUCT360C_metrics_test.json
  trajectory_val_metrics_path: reports/STRUCT360C_trajectory_metrics_val.json
  trajectory_test_metrics_path: reports/STRUCT360C_trajectory_metrics_test.json
  comparison_summary_path: reports/STRUCT360C_vs_FINAL360I_STRUCT360B_SEQ360A_SEQ360B_BASE360D_summary.md
  trajectory_dir: external_baselines/results/struct360c_rotation_aware_trajectory

data:
  image_hw: [384, 768]
  tmag_epsilon: 1.0e-6
  train_batch_size: 2
  eval_batch_size: 8
  num_workers: 2
  train_subset_max: 256
  shuffle_train: true
  require_paths: true
  skip_invalid: true

model:
  strict_load_attempt: false
  use_cuda_if_available: true
  freeze_coarse_warmup: true
  struct360c_bias_gamma: 1.0
  struct360c_bias_clamp_min: -4.0
  struct360c_bias_clamp_max: 0.0
  struct360b:
    fine_heads: 4
    fine_dropout: 0.05
    fine_mlp_ratio: 2.0
    refiner_gate_bias: -2.0
    residual_hidden_dim: 256
    delta_rot_scale: 0.08
    delta_tdir_scale: 0.25
    delta_log_tmag_scale: 0.35
    residual_gate_bias: -2.5
    residual_gate_max: 0.5
    alpha: 0.25
    beta: 0.25

loss:
  rot_weight: 1.0
  tdir_weight: 1.0
  tmag_weight: 0.5
  scale_stability_weight: 0.1
  tmag_loss_type: log_smooth_l1
  coarse_aux_weight: 0.5
  residual_reg_weight: 0.05
  bias_reg_weight: 0.0
  k_step_balancing:
    weight_k1: 1.0
    weight_k2: 1.05
    weight_k3: 1.0
    weight_k5: 0.9
  observability:
    tmag_epsilon: 1.0e-6
    near_zero_tmag: 0.02
    low_tmag: 0.05
    medium_tmag: 0.15
    high_tmag: 0.4
    min_weight: 0.2
    max_weight: 2.0
    k1_factor: 1.05
    k2_factor: 1.0
    k3_factor: 0.95
    k5_factor: 0.85
  scale_stability:
    collapse_ratio: 0.1
    explosion_ratio: 10.0
    mean_log_bias_weight: 1.0
  components:
    enable_observability: true
    enable_k_step_balancing: true
    enable_scale_stabilization: true

training:
  enabled: true
  run_name: STRUCT360C_main_FINAL360Iinit
  epochs: 3
  optimizer: AdamW
  coarse_lr: 1.0e-5
  fine_lr: 3.0e-5
  warmup_coarse_lr: 0.0
  warmup_fine_lr: 3.0e-5
  warmup_epochs: 1
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  amp: false
  seed: 3407
  scheduler: cosine
  min_lr: 1.0e-6

evaluation:
  max_val_batches: null
  max_test_batches: null
  run_test: true
  selection_score:
    signed_tdir_weight: 1.0
    anti_parallel_weight: 70.0
    tmag_ratio_weight: 20.0
    path_ratio_weight: 10.0
    rot_weight: 0.1
