task_name: STRUCT360B_main_Dinit

prechecks:
  expected_branches:
    - experiment/struct360a-implicit-spherical-cross-attention
    - experiment/struct360b-match-free-coarse-to-fine-pose-refinement

inputs:
  hygiene_json: checkpoints/DSET2C_360DVO_dataset_hygiene.json
  train_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_train.jsonl
  val_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_val.jsonl
  test_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_test.jsonl
  dataset_adapter: datasets/dset2c_manifest_dataset.py
  init_checkpoint: checkpoints/TRAIN360D_observability_kstep_scale/best_val.pt
  train360c_val_metrics: reports/TRAIN360C_metrics_val.json
  train360c_test_metrics: reports/TRAIN360C_metrics_test.json
  train360d_report: reports/TRAIN360D_observability_kstep_scale_stabilization.md
  train360d_val_metrics: reports/TRAIN360D_metrics_val.json
  train360d_test_metrics: reports/TRAIN360D_metrics_test.json
  train360h_report: reports/TRAIN360H_hyperparameter_sweep.md
  train360h_val_metrics: reports/TRAIN360H_best_config_val.json
  train360h_test_metrics: reports/TRAIN360H_best_config_test.json
  struct360a_report: reports/STRUCT360A_implicit_spherical_cross_attention.md
  struct360a_val_metrics: reports/STRUCT360A_metrics_val.json
  struct360a_test_metrics: reports/STRUCT360A_metrics_test.json
  struct360a_summary: reports/STRUCT360A_vs_TRAIN360C_D_H_BASE360D_summary.md
  train360h_best_checkpoint: checkpoints/TRAIN360H_sweep/TRAIN360H_F01_TRAIN360H_S1_best_seed1/best_val.pt
  struct360a_best_checkpoint: checkpoints/STRUCT360A_implicit_spherical_cross_attention/best_val.pt
  base360d_val_metrics: reports/BASE360D_metrics_val.json
  base360d_test_metrics: reports/BASE360D_metrics_test.json

outputs:
  checkpoint_dir: checkpoints/STRUCT360B_match_free_coarse_to_fine
  report_path: reports/STRUCT360B_match_free_coarse_to_fine_pose_refinement.md
  val_metrics_path: reports/STRUCT360B_metrics_val.json
  test_metrics_path: reports/STRUCT360B_metrics_test.json
  comparison_summary_path: reports/STRUCT360B_vs_TRAIN360C_D_H_STRUCT360A_BASE360D_summary.md

data:
  image_hw: [384, 768]
  tmag_epsilon: 1.0e-6
  train_batch_size: 2
  eval_batch_size: 8
  num_workers: 4
  train_subset_max: 256
  shuffle_train: true
  require_paths: true
  skip_invalid: true

model:
  strict_load_attempt: true
  use_cuda_if_available: true
  init_source: TRAIN360D
  enable_depth_fusion: false
  struct360b:
    fine_heads: 4
    fine_dropout: 0.05
    fine_mlp_ratio: 2.0
    refiner_gate_bias: -2.0
    residual_hidden_dim: 256
    delta_rot_scale: 0.08
    delta_tdir_scale: 0.25
    delta_log_tmag_scale: 0.35
    residual_gate_bias: -2.5
    residual_gate_max: 0.5
    alpha: 0.25
    beta: 0.25

loss:
  rot_weight: 1.0
  tdir_weight: 1.0
  tmag_weight: 0.5
  scale_stability_weight: 0.1
  tmag_loss_type: log_smooth_l1
  coarse_aux_weight: 0.5
  residual_reg_weight: 0.05
  components:
    enable_observability: true
    enable_k_step_balancing: true
    enable_scale_stabilization: true
  k_step_balancing:
    weight_k1: 1.0
    weight_k2: 1.05
    weight_k3: 1.0
    weight_k5: 0.9
  observability:
    tmag_epsilon: 1.0e-6
    near_zero_tmag: 0.02
    low_tmag: 0.05
    medium_tmag: 0.15
    high_tmag: 0.4
    min_weight: 0.2
    max_weight: 2.0
    k1_factor: 1.05
    k2_factor: 1.0
    k3_factor: 0.95
    k5_factor: 0.85
  scale_stability:
    collapse_ratio: 0.1
    explosion_ratio: 10.0
    mean_log_bias_weight: 1.0

training:
  epochs: 5
  optimizer: AdamW
  coarse_lr: 1.0e-5
  fine_lr: 1.0e-4
  warmup_coarse_lr: 0.0
  warmup_fine_lr: 1.0e-4
  warmup_epochs: 2
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  amp: false
  seed: 3407
  scheduler: cosine
  min_lr: 1.0e-6

evaluation:
  max_val_batches: null
  max_test_batches: null
  run_test: true
  selection_score:
    signed_tdir_weight: 1.0
    anti_parallel_weight: 60.0
    tmag_ratio_weight: 20.0
    path_ratio_weight: 10.0
    rot_weight: 0.0
