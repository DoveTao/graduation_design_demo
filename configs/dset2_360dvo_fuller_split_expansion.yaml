dataset:
  name: 360DVO
  local_root: data/360DVO
  do_not_commit_raw_data: true
  source_repo: chris1004336379/360DVO
  repo_type: dataset
  image_type: ERP
  expected_resolution: [3840, 1920]

current_dset1:
  sequences:
    - bridge_night
    - field
    - wingsuit

target_expansion:
  target_num_sequences: 10
  min_num_sequences: 7
  max_num_sequences: 12
  max_download_bytes: 12884901888
  max_files_per_sequence: 1200
  avoid_full_dataset_download_if_possible: true
  prefer_diverse_motion: true
  prefer_easy_hard_balance: true

split:
  split_by_sequence: true
  forbid_random_pair_split: true
  min_train_sequences: 5
  min_val_sequences: 1
  min_test_sequences: 1
  target_train_sequences: 7
  target_val_sequences: 2
  target_test_sequences: 2
  auto_split: true

pair_manifest:
  pair_types:
    - adjacent
    - kstep
  k_values: [1, 2, 3, 5]
  max_pairs_per_sequence: 1500
  output_convention:
    R_BA: true
    t_BA_B: true
    tdir_frame: B

readiness_thresholds:
  min_total_sequences: 7
  min_train_pairs: 2000
  min_val_pairs: 300
  min_test_pairs: 300
  max_small_motion_fraction: 0.05
  require_sequence_split: true

evaluation:
  no_training: true
  no_finetune: true
  no_gt_calibration: true
