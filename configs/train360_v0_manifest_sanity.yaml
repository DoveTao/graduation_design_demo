task: TRAIN360B_manifest_native_dataloader_adapter_and_forward_sanity

reports:
  train360a_markdown: reports/TRAIN360A_architecture_inventory_and_reusable_module_audit.md
  train360a_module_matrix: reports/TRAIN360A_reusable_module_matrix.json
  train360b_markdown: reports/TRAIN360B_manifest_native_dataloader_adapter_and_forward_sanity.md
  train360b_forward_json: reports/TRAIN360B_forward_sanity.json

dataset:
  hygiene_json: checkpoints/DSET2C_360DVO_dataset_hygiene.json
  train_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_train.jsonl
  val_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_val.jsonl
  test_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_test.jsonl
  expected_image_hw: [1024, 2048]
  tmag_epsilon: 1.0e-6
  batch_size: 1
  num_workers: 0
  require_paths: true
  skip_invalid: true

model:
  checkpoint: checkpoints/T57b_no_dt_multiscale_tmag_head_400/final.pt
  strict_load_attempt: true
  use_cuda_if_available: true
  enable_depth_fusion: true

sanity:
  splits: [train, val, test]
  max_batches_per_split: 1
  no_grad: true
  create_optimizer: false
  call_backward: false
  save_weights: false
