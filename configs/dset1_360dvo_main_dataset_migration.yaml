dataset:
  name: 360DVO
  local_root: data/360DVO
  do_not_commit_raw_data: true
  source_repo: chris1004336379/360DVO
  repo_type: dataset
  image_type: ERP
  expected_resolution: [3840, 1920]
  timestamp_policy: use_existing_or_synthesize_if_missing
  pose_format_policy: tum_like_or_detected

sequence_selection:
  already_available:
    - field
  target_num_sequences: 5
  min_sequences_required: 3
  max_download_bytes: 21474836480
  max_files_per_sequence: 1200
  prefer_diverse_motion: true
  avoid_full_dataset_download_if_possible: true

split:
  split_by_sequence: true
  forbid_random_pair_split: true
  train_sequences: []
  val_sequences: []
  test_sequences: []
  split_policy: auto_if_enough_sequences

pair_manifest:
  pair_types:
    - adjacent
    - kstep
  k_values: [1, 2, 3, 5]
  max_pairs_per_sequence: 1000
  max_smoke_pairs_per_sequence: 200
  output_convention:
    R_BA: true
    t_BA_B: true
    tdir_frame: B

legacy_dataset:
  enabled: true
  root: data/PanoramaView
  sequences:
    - scene01/seq01
    - scene01/seq02
    - scene01/seq03
  quality_audit:
    enabled: true
    sample_limit_per_sequence: 200

quality_metrics:
  low_texture: true
  blur_laplacian: true
  seam_score: true
  exposure_discontinuity: true
  feature_density: true
  sky_snow_bright_area_proxy: true
  pair_photometric_change: true

evaluation:
  no_training: true
  no_finetune: true
  no_gt_calibration: true
