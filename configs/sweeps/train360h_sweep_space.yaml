task_name: TRAIN360H_hyperparameter_sweep_after_TRAIN360D_success
expected_branch: experiment/train360d-observability-kstep-scale
base_train360d_config: configs/train360d_observability_kstep_scale.yaml
required_train360d_checkpoint: checkpoints/TRAIN360D_observability_kstep_scale/best_val.pt

common_overrides:
  data:
    train_batch_size: 2
    eval_batch_size: 8
    num_workers: 4
  evaluation:
    max_val_batches: 16
    max_test_batches: 16

phases:
  ablation:
    epochs: 2
    train_subset_max: 32
  coarse:
    epochs: 2
    train_subset_max: 24
  refined:
    epochs: 3
    train_subset_max: 32
  seed_robustness:
    epochs: 3
    train_subset_max: 32
    seeds: [1, 2]
  final_eval:
    train_subset_max: 48

ablation_runs:
  TRAIN360H_A0_reproduce_D_seed0:
    training:
      epochs: 2
      seed: 3407
    data:
      train_subset_max: 32
    loss:
      components:
        enable_observability: true
        enable_k_step_balancing: true
        enable_scale_stabilization: true
  TRAIN360H_A1_obs_only_seed0:
    training:
      epochs: 2
      seed: 3407
    data:
      train_subset_max: 32
    loss:
      scale_stability_weight: 0.0
      components:
        enable_observability: true
        enable_k_step_balancing: false
        enable_scale_stabilization: false
  TRAIN360H_A3_scale_only_seed0:
    training:
      epochs: 2
      seed: 3407
    data:
      train_subset_max: 32
    loss:
      components:
        enable_observability: false
        enable_k_step_balancing: false
        enable_scale_stabilization: true
  TRAIN360H_A4_obs_kstep_no_scale_seed0:
    training:
      epochs: 2
      seed: 3407
    data:
      train_subset_max: 32
    loss:
      scale_stability_weight: 0.0
      components:
        enable_observability: true
        enable_k_step_balancing: true
        enable_scale_stabilization: false

coarse_runs:
  TRAIN360H_C01_lr3e5_dir2p0_scale0p05_seed0:
    training:
      lr: 3.0e-5
      weight_decay: 1.0e-4
      epochs: 2
      scheduler: none
      grad_clip_norm: 1.0
      seed: 3407
    data:
      train_subset_max: 24
    loss:
      tdir_weight: 2.0
      tmag_weight: 0.75
      scale_stability_weight: 0.05
      k_step_balancing:
        mode: adjacent_vs_nonadjacent
        adjacent_weight: 1.25
        non_adjacent_weight: 1.0
        decay: none
        min_weight: 0.2
      observability:
        min_weight: 0.5
        max_weight: 1.5
        near_zero_tmag: 0.005
        moderate_baseline_boost: 1.25
        medium_weight: 1.25
        high_weight: 1.35
    evaluation:
      selection_score:
        anti_parallel_weight: 30.0
        tmag_ratio_weight: 20.0
        path_ratio_weight: 10.0
        rot_weight: 0.0
  TRAIN360H_C02_lr5e5_dir2p0_scale0p1_seed0:
    training:
      lr: 5.0e-5
      weight_decay: 1.0e-3
      epochs: 2
      scheduler: cosine
      grad_clip_norm: 1.0
      seed: 3407
    data:
      train_subset_max: 24
    loss:
      tdir_weight: 2.0
      tmag_weight: 1.0
      scale_stability_weight: 0.1
      k_step_balancing:
        mode: adjacent_vs_nonadjacent
        adjacent_weight: 1.25
        non_adjacent_weight: 1.0
        decay: log
        min_weight: 0.2
      observability:
        min_weight: 0.5
        max_weight: 2.0
        near_zero_tmag: 0.001
        moderate_baseline_boost: 1.25
        medium_weight: 1.25
        high_weight: 1.5
    evaluation:
      selection_score:
        anti_parallel_weight: 50.0
        tmag_ratio_weight: 20.0
        path_ratio_weight: 10.0
        rot_weight: 0.25
  TRAIN360H_C03_lr1e4_dir1p5_scale0p2_seed0:
    training:
      lr: 1.0e-4
      weight_decay: 1.0e-5
      epochs: 2
      scheduler: step
      step_size: 2
      step_gamma: 0.5
      grad_clip_norm: 0.5
      seed: 3407
    data:
      train_subset_max: 24
    loss:
      tdir_weight: 1.5
      tmag_weight: 1.25
      scale_stability_weight: 0.2
      k_step_balancing:
        mode: adjacent_vs_nonadjacent
        adjacent_weight: 1.0
        non_adjacent_weight: 1.25
        decay: clipped_linear
        min_weight: 0.4
      observability:
        min_weight: 0.75
        max_weight: 2.5
        near_zero_tmag: 0.0005
        moderate_baseline_boost: 1.5
        medium_weight: 1.5
        high_weight: 1.65
    evaluation:
      selection_score:
        anti_parallel_weight: 80.0
        tmag_ratio_weight: 30.0
        path_ratio_weight: 20.0
        rot_weight: 0.5
  TRAIN360H_C04_obs_scale_no_k_seed0:
    training:
      lr: 5.0e-5
      weight_decay: 0.0
      epochs: 2
      scheduler: cosine
      grad_clip_norm: 1.0
      seed: 3407
    data:
      train_subset_max: 24
    loss:
      tdir_weight: 2.5
      tmag_weight: 1.0
      scale_stability_weight: 0.1
      components:
        enable_observability: true
        enable_k_step_balancing: false
        enable_scale_stabilization: true
      observability:
        min_weight: 0.25
        max_weight: 2.0
        near_zero_tmag: 0.005
        moderate_baseline_boost: 1.5
        medium_weight: 1.5
        high_weight: 1.7
    evaluation:
      selection_score:
        anti_parallel_weight: 50.0
        tmag_ratio_weight: 30.0
        path_ratio_weight: 20.0
        rot_weight: 0.25
  TRAIN360H_C05_obs_k_no_scale_seed0:
    training:
      lr: 5.0e-5
      weight_decay: 1.0e-4
      epochs: 2
      scheduler: cosine
      grad_clip_norm: 2.0
      seed: 3407
    data:
      train_subset_max: 24
    loss:
      tdir_weight: 2.5
      tmag_weight: 0.75
      scale_stability_weight: 0.0
      components:
        enable_observability: true
        enable_k_step_balancing: true
        enable_scale_stabilization: false
      k_step_balancing:
        mode: adjacent_vs_nonadjacent
        adjacent_weight: 1.5
        non_adjacent_weight: 1.0
        decay: sqrt
        min_weight: 0.2
      observability:
        min_weight: 0.5
        max_weight: 2.5
        near_zero_tmag: 0.001
        moderate_baseline_boost: 1.5
        medium_weight: 1.5
        high_weight: 1.65
    evaluation:
      selection_score:
        anti_parallel_weight: 80.0
        tmag_ratio_weight: 10.0
        path_ratio_weight: 5.0
