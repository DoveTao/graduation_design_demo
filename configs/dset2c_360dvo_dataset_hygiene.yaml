dataset:
  name: 360DVO
  local_root: data/360DVO
  do_not_commit_raw_data: true

source:
  dset2b_checkpoint: checkpoints/DSET2B_360DVO_pair_count_completion.json
  dset2b_manifest_dir: external_baselines/results/dset2b_360dvo_pair_count_completion

hygiene:
  do_not_delete_raw_files: true
  quarantine_by_metadata_only: true
  min_images_for_train_sequence: 80
  min_pose_rows_for_train_sequence: 80
  min_valid_adjacent_pairs: 50
  min_valid_total_pairs: 200
  allow_partial_if_valid_pairs_high: true

canonical_manifest:
  output_dir: external_baselines/results/dset2c_360dvo_canonical
  split_by_sequence: true
  forbid_random_pair_split: true
  k_values: [1, 2, 3, 5]
  output_convention:
    R_BA: true
    t_BA_B: true
    tdir_frame: B

evaluation:
  no_training: true
  no_finetune: true
  no_gt_calibration: true
