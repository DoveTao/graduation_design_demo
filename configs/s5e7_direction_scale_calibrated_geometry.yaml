experiment: S5E7_direction_scale_calibrated_geometry
status:
  experimental_candidate: true
  not_official_replacement: true
  official_s5_locked_metrics_unchanged: true

outputs:
  checkpoint_json: checkpoints/S5E7_direction_scale_calibrated_geometry_candidate.json
  report_main: reports/s5e7_direction_scale_calibrated_geometry_report.md
  report_comparison: reports/s5e7_s5e6_s5e5_s5e4_s5e3_s5e2_orbslam3_comparison.md
  result_dir: external_baselines/results/s5e7_traceable_dense
  trajectory_path: external_baselines/results/s5e7_traceable_dense/scene01_seq03_s5e7_traceable_dense_tum.txt
  raw_trajectory_path: external_baselines/results/s5e7_traceable_dense/scene01_seq03_s5e7_traceable_dense_raw_tum.txt
  provenance_path: external_baselines/results/s5e7_traceable_dense/edge_provenance.jsonl
  metrics_path: external_baselines/results/s5e7_traceable_dense/edge_component_metrics.json
  audit_path: external_baselines/results/s5e7_traceable_dense/direction_scale_failure_audit.json

data:
  data_root: data
  split_by: scene_seq
  train_ratio: 0.8
  split_seed: 3407
  train_sequences: [scene01/seq01, scene01/seq02]
  eval_sequence: scene01/seq03
  uses_scene01_seq03_for_training: false
  no_gt_leakage: true
  no_restored_dense_artifact_for_prediction: true
  no_orbslam3_distillation: true

model:
  model_type: direction_scale_calibrated_geometry
  factorization_formula: "pred_t = pred_dir_unit * pred_tmag"
  translation_factorization: pred_t_equals_pred_dir_unit_times_pred_tmag
  pred_dir_unit: true
  pred_log_scale_delta: true
  pred_tmag: true
  pred_t: true
  optional_confidence: true
  optional_motion_bucket: true
  bounded_log_scale_delta: true
  log_scale_clip: 1.25
  guard_policy: fallback_only

losses:
  so3_geodesic: true
  signed_tdir: true
  tdir_abs_aux: true
  anti_parallel_penalty: true
  scale_residual_smooth_l1: true
  path_length_consistency: true
  short_window_direction_consistency: true
  smoothness: true
  robust_tmag_log: true
  tmag_p95_penalty: true

caveats:
  - S5E7 is experimental and does not replace official S5 locked result.
  - S5 locked metrics/policy unchanged.
  - scene01/seq03 GT is used only for evaluation / diagnostics.
  - No restored dense artifact is used to generate prediction.
  - ORB-SLAM3 trajectory is not used as a training label.
  - S5E6 guard is fallback only and must not be treated as learned geometry improvement.

references:
  s5e6_rot_mean_deg: 0.9134395040767528
  s5e6_signed_tdir_mean_deg: 51.47429479273258
  s5e6_tdir_abs_mean_deg: 46.07968707914154
  s5e6_anti_parallel_rate: 0.1368653421633554
  s5e6_tmag_median_ratio: 11.352940388835835
  s5e6_tmag_p95_ratio: 63.490479510847564
  s5e6_path_ratio: 1.880843438039364
  s5e6_sim3_ate: 4.012221895981248
  orbslam3_se3_ate: 0.30854441069248173
  orbslam3_sim3_ate: 0.224292165986624

allowed_final_classifications:
  - S5E7_DIRECTION_SCALE_IMPROVED
  - S5E7_DIRECTION_ONLY_IMPROVED
  - S5E7_SCALE_ONLY_IMPROVED
  - S5E7_GUARD_DEPENDENT
  - S5E7_NO_GEOMETRY_IMPROVEMENT
  - S5E7_REGRESSION
