task_name: SEQ360A_sequence_consistency_scale_drift_stabilization
dry_run: false

prechecks:
  expected_branches:
    - experiment/seq360b-train-lightweight-scale-smoothing-head
    - experiment/dev360-prepare-next-model-variants-no-training
    - experiment/seq360a-sequence-consistency-scale-drift-stabilization
  min_disk_free_gb: 5.0
  required_env: pytorch

inputs:
  base_config: configs/struct360b_match_free_coarse_to_fine.yaml
  final360i_config: configs/final360i_struct360b_final.yaml
  hygiene_json: checkpoints/DSET2C_360DVO_dataset_hygiene.json
  train_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_train.jsonl
  val_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_val.jsonl
  test_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_test.jsonl
  dataset_adapter: datasets/dset2c_manifest_dataset.py
  sequence_clip_dataset: datasets/dset2c_sequence_clip_dataset.py
  init_checkpoint: checkpoints/FINAL360I_struct360b_final/seed0/best_val.pt
  comparison_checkpoint_seq360b: checkpoints/SEQ360B_lightweight_scale_smoothing/best_val.pt
  final360i_val_metrics: reports/FINAL360I_metrics_val.json
  final360i_test_metrics: reports/FINAL360I_metrics_test.json
  train360e_val_metrics: reports/TRAIN360E_metrics_val.json
  train360e_test_metrics: reports/TRAIN360E_metrics_test.json
  base360d_val_metrics: reports/BASE360_metrics_val.json
  base360d_test_metrics: reports/BASE360_metrics_test.json

outputs:
  checkpoint_dir: checkpoints/SEQ360A_sequence_consistency_scale_drift
  trajectory_dir: external_baselines/results/seq360a_sequence_consistency_trajectory
  report_path: reports/SEQ360A_sequence_consistency_scale_drift_stabilization.md
  val_metrics_path: reports/SEQ360A_metrics_val.json
  test_metrics_path: reports/SEQ360A_metrics_test.json
  trajectory_val_metrics_path: reports/SEQ360A_trajectory_metrics_val.json
  trajectory_test_metrics_path: reports/SEQ360A_trajectory_metrics_test.json
  comparison_summary_path: reports/SEQ360A_vs_FINAL360I_SEQ360B_TRAIN360E_BASE360D_summary.md

data:
  image_hw: [384, 768]
  clip_len: 3
  max_frame_gap: 1
  max_timestamp_gap_factor: 1.75
  tmag_epsilon: 1.0e-6
  train_batch_size: 1
  eval_batch_size: 8
  clip_eval_batch_size: 1
  num_workers: 2
  train_subset_max: 256
  shuffle_train: true
  require_paths: true
  skip_invalid: true

model:
  strict_load_attempt: false
  use_cuda_if_available: true
  freeze_coarse_warmup: true
  struct360b:
    fine_heads: 4
    fine_dropout: 0.05
    fine_mlp_ratio: 2.0
    refiner_gate_bias: -2.0
    residual_hidden_dim: 256
    delta_rot_scale: 0.08
    delta_tdir_scale: 0.25
    delta_log_tmag_scale: 0.22
    residual_gate_bias: -2.5
    residual_gate_max: 0.5
    alpha: 0.25
    beta: 0.25

loss:
  pair_loss: 1.0
  lambda_comp_rot: 0.2
  lambda_comp_tdir: 0.2
  lambda_comp_log_tmag: 0.15
  lambda_path: 0.1
  lambda_rot_accum: 0.2
  lambda_delta_reg: 0.05
  coarse_aux_weight: 0.2
  pair_tmag_weight: 0.5
  tmag_loss_type: log_smooth_l1

training:
  enabled: true
  run_name: SEQ360A_clip3_main_FINAL360Iinit
  epochs: 3
  optimizer: AdamW
  coarse_lr: 1.0e-5
  fine_lr: 3.0e-5
  warmup_coarse_lr: 0.0
  warmup_fine_lr: 3.0e-5
  warmup_epochs: 1
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  amp: false
  seed: 3407
  scheduler: cosine
  min_lr: 1.0e-6

evaluation:
  max_val_batches: null
  max_test_batches: null
  max_clip_val_batches: null
  run_test: true
  selection_score:
    signed_tdir_weight: 1.0
    anti_parallel_weight: 60.0
    tmag_ratio_weight: 20.0
    path_ratio_weight: 10.0
    clip_path_ratio_weight: 30.0
    comp_rot_weight: 10.0
    comp_tdir_weight: 10.0
