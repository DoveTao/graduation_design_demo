experiment: S5E8_translation_geometry_diagnostic_ablation
status:
  experimental_candidate: true
  not_official_replacement: true
  official_s5_locked_metrics_unchanged: true

outputs:
  checkpoint_json: checkpoints/S5E8_translation_geometry_diagnostic_ablation_candidate.json
  report_main: reports/s5e8_translation_geometry_diagnostic_ablation_report.md
  report_comparison: reports/s5e8_s5e7_s5e6_s5e5_s5e4_s5e3_s5e2_orbslam3_comparison.md
  result_dir: external_baselines/results/s5e8_traceable_dense
  trajectory_path: external_baselines/results/s5e8_traceable_dense/scene01_seq03_s5e8_traceable_dense_tum.txt
  raw_trajectory_path: external_baselines/results/s5e8_traceable_dense/scene01_seq03_s5e8_traceable_dense_raw_tum.txt
  provenance_path: external_baselines/results/s5e8_traceable_dense/edge_provenance.jsonl
  metrics_path: external_baselines/results/s5e8_traceable_dense/edge_component_metrics.json
  audit_path: external_baselines/results/s5e8_traceable_dense/translation_supervision_quality.json

data:
  uses_scene01_seq03_for_training: false
  no_gt_leakage: true
  no_restored_dense_artifact_for_prediction: true
  no_orbslam3_distillation: true

model:
  model_type: translation_geometry_diagnostic_ablation
  direction_only_candidate: true
  oracle_direction_ablation: true
  oracle_scale_ablation: true
  prior_only_baseline: true
  numeric_only_control: true
  raw_vs_guarded_reporting: true

report_language:
  human_readable_default: 中文

allowed_final_classifications:
  - S5E8_DIRECTION_SUPERVISION_LIMITED
  - S5E8_SCALE_SUPERVISION_LIMITED
  - S5E8_INPUT_GEOMETRY_INSUFFICIENT
  - S5E8_SMALL_MOTION_DOMINATED
  - S5E8_DIRECTION_ONLY_IMPROVED
  - S5E8_RAW_GEOMETRY_IMPROVED
  - S5E8_GUARD_DEPENDENT
  - S5E8_NO_IMPROVEMENT
  - S5E8_REGRESSION

caveats:
  - S5E8 是实验性诊断，不替换官方 S5 locked 结果。
  - 只有 raw prediction 在 direction 和 high-percentile scale 上同时改善，才可视为真实几何提升。
