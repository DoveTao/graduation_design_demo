task_name: FINAL360I_final_retrain_and_model_selection

prechecks:
  expected_branches:
    - experiment/struct360b-match-free-coarse-to-fine-pose-refinement
    - experiment/final360i-final-retrain-and-model-selection
  min_disk_free_gb: 5.0
  required_env: pytorch

inputs:
  base_config: configs/struct360b_match_free_coarse_to_fine.yaml
  hygiene_json: checkpoints/DSET2C_360DVO_dataset_hygiene.json
  train_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_train.jsonl
  val_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_val.jsonl
  test_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_test.jsonl
  dataset_adapter: datasets/dset2c_manifest_dataset.py
  init_checkpoint: checkpoints/TRAIN360D_observability_kstep_scale/best_val.pt
  struct360b_best_checkpoint: checkpoints/STRUCT360B_match_free_coarse_to_fine/best_val.pt
  train360c_val_metrics: reports/TRAIN360C_metrics_val.json
  train360c_test_metrics: reports/TRAIN360C_metrics_test.json
  train360d_val_metrics: reports/TRAIN360D_metrics_val.json
  train360d_test_metrics: reports/TRAIN360D_metrics_test.json
  train360h_val_metrics: reports/TRAIN360H_best_config_val.json
  train360h_test_metrics: reports/TRAIN360H_best_config_test.json
  struct360a_val_metrics: reports/STRUCT360A_metrics_val.json
  struct360a_test_metrics: reports/STRUCT360A_metrics_test.json
  struct360b_val_metrics: reports/STRUCT360B_metrics_val.json
  struct360b_test_metrics: reports/STRUCT360B_metrics_test.json
  base360d_val_metrics: reports/BASE360D_metrics_val.json
  base360d_test_metrics: reports/BASE360D_metrics_test.json

outputs:
  root_checkpoint_dir: checkpoints/FINAL360I_struct360b_final
  report_path: reports/FINAL360I_final_retrain_and_model_selection.md
  val_metrics_path: reports/FINAL360I_metrics_val.json
  test_metrics_path: reports/FINAL360I_metrics_test.json
  model_selection_table_path: reports/FINAL360I_model_selection_table.json
  comparison_summary_path: reports/FINAL360I_vs_all_baselines_summary.md
  thesis_paragraph_path: reports/FINAL360I_thesis_ready_result_paragraph.md

training:
  seeds: [0]
  seed_policy: resource_limited_single_seed
  epochs: 5
  use_train360d_init: true
  run_test_during_seed_training: false

selection:
  score:
    signed_tdir_weight: 1.0
    anti_parallel_weight: 60.0
    tmag_ratio_weight: 20.0
    path_ratio_weight: 10.0
    rot_weight: 0.0
  final_candidate: STRUCT360B
  fallback_policy: fallback_to_STRUCT360B_if_retrain_underperforms
  balanced_target:
    signed_tdir_mean_deg_max: 47.0
    anti_parallel_rate_max: 0.205
    tmag_median_ratio_min: 0.80
    path_ratio_min: 0.62
  strong_target:
    signed_tdir_mean_deg_max: 44.986174454415895
    anti_parallel_rate_max: 0.19695772421967603
    tmag_median_ratio_min: 0.8503917514492008
    path_ratio_min: 0.6493755813576354
  fallback_reference_name: STRUCT360B_balanced_best

reporting:
  next_recommendation_default: prepare_thesis_experiment_section
