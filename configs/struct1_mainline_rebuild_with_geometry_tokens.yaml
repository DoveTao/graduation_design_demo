model:
  name: STRUCT1_mainline_rebuild_with_geometry_tokens
  preserve_spherical_token_backbone: true
  use_tangent_patch_canonicalization: true
  use_soft_correspondence_geometry_layer: true
  use_geometry_token_pose_solver: true
  use_coarse_to_fine: true
  use_external_router: false
  base_candidate_for_comparison: S5E15_scale_deunderfit_antiparallel_candidate
  allow_fallback_to_s5e15_prediction: false
  hidden_dim: 96
  backbone_heads: 4
  topk_pool: 16

spherical_backbone:
  erp_sampling: true
  bearing_pos_encoding: true
  local_tangent_coords: true
  bearing_xyz_channels: true
  latlon_sincos_channels: true
  token_encoder_layers: 2
  coarse_tokens: 64
  fine_tokens: 24

soft_correspondence_geometry_layer:
  use_W_ab: true
  use_W_ba: true
  compute_matched_bearings: true
  compute_cycle_consistency: true
  compute_entropy_confidence: true
  compute_epipolar_residual: true
  output_geometry_tokens: true
  temperature: 0.05
  max_matches: 64

geometry_tokens:
  fields:
    - bearing_a
    - matched_bearing_b
    - residual_flow
    - confidence
    - entropy
    - cycle_error
    - epipolar_residual
    - interaction_feature
  aggregation:
    - confidence_weighted_mean
    - robust_topk_pool
    - histogram_or_moments

pose_solver:
  type: geometry_aware_decoder
  output:
    - R_BA
    - tdir_B
    - tmag
  rotation_head: coarse_and_refine
  translation_direction_head: geometry_token_based
  scale_head: bounded_train_prior
  avoid_pooled_feature_only_tdir: true
  scale_delta_clip: 0.22
  rotation_refine_scale: 0.03

geometry_losses:
  supervised_pose_anchor: true
  softcorr_cycle: true
  epipolar_residual: true
  inverse_consistency: true
  true_kstep_composition: true
  path_length_consistency: true
  tdir_signed: true
  tdir_abs_aux: true
  anti_parallel_margin: true
  robust_tmag_log: true
  confidence_entropy_regularization: true

observability:
  used_as_loss_weight: true
  used_as_router: false
  low_observability_tdir_weight: low
  high_observability_tdir_weight: high
  low_threshold_quantile: 0.35
  high_threshold_quantile: 0.70

training:
  real_training_required: true
  smoke_policy_allowed: false
  train_scenes: ["scene01/seq01", "scene01/seq02"]
  eval_scene: "scene01/seq03"
  uses_eval_gt_for_training: false
  uses_orbslam3_teacher: false
  save_learned_weights: true
  suggested_steps:
    - 300
    - 800
  learning_rate_candidates:
    - 0.0001
    - 0.0003
  seed: 3407
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 8
  max_steps: 300
  kstep_batch_size: 4

evaluation:
  compare_to: ["S5E15", "ARCH2P", "ARCH2", "ORB-SLAM3"]
  required_metrics:
    - rot
    - signed_tdir
    - tdir_abs
    - anti_parallel_rate
    - tmag_median_ratio
    - path_ratio
    - sim3_ate
    - geometry_token_confidence
    - softcorr_entropy
    - cycle_consistency
    - epipolar_residual

losses:
  w_rot: 0.35
  w_tdir_signed: 1.00
  w_tdir_abs_aux: 0.25
  w_antiparallel: 0.60
  w_tmag_log: 0.25
  w_softcorr_cycle: 0.10
  w_epipolar_residual: 0.15
  w_inverse_consistency: 0.10
  w_kstep_composition: 0.30
  w_path_length_consistency: 0.20
  w_confidence_entropy_regularization: 0.05

kstep_geometry:
  k_values: [1, 2, 3, 5]
