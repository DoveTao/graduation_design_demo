task_name: TRAIN360D_observability_kstep_scale_stabilization

prechecks:
  expected_branch: experiment/train360d-observability-kstep-scale

inputs:
  hygiene_json: checkpoints/DSET2C_360DVO_dataset_hygiene.json
  train_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_train.jsonl
  val_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_val.jsonl
  test_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_test.jsonl
  dataset_adapter: datasets/dset2c_manifest_dataset.py
  init_checkpoint: checkpoints/TRAIN360C_spherical_pose_baseline/best_val.pt
  train360c_best_checkpoint: checkpoints/TRAIN360C_spherical_pose_baseline/best_val.pt
  train360c_final_checkpoint: checkpoints/TRAIN360C_spherical_pose_baseline/final.pt
  train360c_val_metrics: reports/TRAIN360C_metrics_val.json
  train360c_test_metrics: reports/TRAIN360C_metrics_test.json
  base360d_val_metrics: reports/BASE360D_metrics_val.json
  base360d_test_metrics: reports/BASE360D_metrics_test.json

outputs:
  checkpoint_dir: checkpoints/TRAIN360D_observability_kstep_scale
  report_path: reports/TRAIN360D_observability_kstep_scale_stabilization.md
  val_metrics_path: reports/TRAIN360D_metrics_val.json
  test_metrics_path: reports/TRAIN360D_metrics_test.json
  comparison_summary_path: reports/TRAIN360D_vs_TRAIN360C_T57b_BASE360D_summary.md
  next_recommendation: proceed_to_TRAIN360D_ablation

data:
  image_hw: [384, 768]
  tmag_epsilon: 1.0e-6
  train_batch_size: 2
  eval_batch_size: 8
  num_workers: 4
  train_subset_max: 512
  shuffle_train: true
  require_paths: true
  skip_invalid: true

model:
  strict_load_attempt: true
  enable_fine_stage: false
  enable_coupled_pose_head: false
  enable_depth_fusion: false
  use_cuda_if_available: true

loss:
  rot_weight: 1.0
  tdir_weight: 1.0
  tmag_weight: 0.5
  scale_stability_weight: 0.1
  tmag_loss_type: log_smooth_l1
  k_step_balancing:
    weight_k1: 1.0
    weight_k2: 1.05
    weight_k3: 1.0
    weight_k5: 0.9
  observability:
    tmag_epsilon: 1.0e-6
    near_zero_tmag: 0.02
    low_tmag: 0.05
    medium_tmag: 0.15
    high_tmag: 0.4
    min_weight: 0.2
    max_weight: 2.0
    k1_factor: 1.05
    k2_factor: 1.0
    k3_factor: 0.95
    k5_factor: 0.85
  scale_stability:
    collapse_ratio: 0.1
    explosion_ratio: 10.0
    mean_log_bias_weight: 1.0

training:
  epochs: 5
  optimizer: AdamW
  lr: 5.0e-5
  weight_decay: 1.0e-2
  grad_clip_norm: 1.0
  amp: false
  seed: 3407
  scheduler: cosine
  min_lr: 1.0e-6

evaluation:
  max_val_batches: null
  max_test_batches: null
