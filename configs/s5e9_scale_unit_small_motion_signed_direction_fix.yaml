experiment: S5E9_scale_unit_small_motion_signed_direction_fix
status:
  experimental_candidate: true
  not_official_replacement: true
  official_s5_locked_metrics_unchanged: true

outputs:
  checkpoint_json: checkpoints/S5E9_scale_unit_small_motion_signed_direction_fix_candidate.json
  report_main: reports/s5e9_scale_unit_small_motion_signed_direction_fix_report.md
  report_comparison: reports/s5e9_s5e8_s5e7_s5e6_s5e5_s5e4_s5e3_s5e2_orbslam3_comparison.md
  result_dir: external_baselines/results/s5e9_traceable_dense

data:
  uses_scene01_seq03_for_training: false
  no_gt_leakage: true
  no_restored_dense_artifact_for_prediction: true
  no_orbslam3_distillation: true

model:
  scale_first_candidate: true
  signed_direction_order_candidate: true
  tight_bounded_log_scale_residual: true
  log_scale_clip: 1.3862943611198906
  small_motion_near_static_handling: true
  pair_order_diagnostic: true
  raw_vs_guarded_reporting: true

scale_pipeline_required_fields:
  - gt_tmag_median
  - gt_tmag_p90
  - gt_tmag_p95
  - gt_tmag_p99
  - gt_tmag_max
  - prior_tmag_median
  - prior_tmag_p90
  - prior_tmag_p95
  - prior_tmag_max
  - pred_log_scale_delta_min
  - pred_log_scale_delta_median
  - pred_log_scale_delta_p90
  - pred_log_scale_delta_p95
  - pred_log_scale_delta_p99
  - pred_log_scale_delta_max
  - residual_saturation_rate
  - over_scale_rate
  - under_scale_rate

report_language:
  human_readable_default: 中文

allowed_final_classifications:
  - S5E9_SCALE_UNIT_BUG_FOUND
  - S5E9_SCALE_RAW_IMPROVED
  - S5E9_SIGNED_DIRECTION_IMPROVED
  - S5E9_SMALL_MOTION_IMPROVED
  - S5E9_RAW_GEOMETRY_IMPROVED
  - S5E9_GUARD_DEPENDENT
  - S5E9_INPUT_GEOMETRY_INSUFFICIENT
  - S5E9_NO_IMPROVEMENT
  - S5E9_REGRESSION

caveats:
  - S5E9 是 experimental，不替换 official S5 locked result。
  - 只有 raw scale/path 与 raw direction 同时改善，才可视为真实几何改善。
  - 若改善仍主要来自 guarded trajectory，必须归类为 S5E9_GUARD_DEPENDENT。
