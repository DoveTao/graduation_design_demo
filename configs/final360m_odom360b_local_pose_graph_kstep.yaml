task_name: FINAL360M_ODOM360B_local_pose_graph_with_kstep_constraints

prechecks:
  expected_branches:
    - research/odom360a-lightweight-trajectory-fusion
    - research/odom360b-local-pose-graph-kstep
    - research/abldvo3-single-stage-pose-regression-ablation
  require_expected_branch: false
  require_clean_worktree: false
  min_disk_free_gb: 5.0
  required_env: pytorch

inputs:
  checkpoint: checkpoints/FINAL360M_fulltrain_struct360b_thesis_main_guarded/best_full_val.pt
  train_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_train.jsonl
  val_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_val.jsonl
  test_manifest: external_baselines/results/dset2c_360dvo_canonical/pair_manifest_test.jsonl
  final360i_metrics_test: reports/FINAL360M_metrics_test.json
  train360e_metrics_test: reports/TRAIN360E_metrics_test.json
  seq360b_metrics_test: reports/SEQ360B_metrics_test.json
  seq360b_trajectory_metrics_test: reports/SEQ360B_trajectory_metrics_test.json
  odom360a_metrics_val: reports/FINAL360M_ODOM360A_metrics_val.json
  odom360a_metrics_test: reports/FINAL360M_ODOM360A_metrics_test.json
  odom360a_report: reports/FINAL360M_ODOM360A_lightweight_trajectory_fusion.md
  odom360a_summary: reports/FINAL360M_ODOM360A_vs_old_backends_summary.md
  results_table: reports/RESULTS360_main_results_table.md
  results_narrative: reports/RESULTS360_experiment_narrative.md
  current_mainline: CURRENT_MAINLINE.md
  delivery_handoff: DELIVERY_HANDOFF.md
  odom360a_result_root: external_baselines/results/final360m_odom360a_lightweight_trajectory_fusion
  data360a_pair_rows_root: external_baselines/results/data360a_tdir_regime_diagnostic

outputs:
  result_root: external_baselines/results/final360m_odom360b_local_pose_graph_kstep
  report_path: reports/FINAL360M_ODOM360B_local_pose_graph_with_kstep_constraints.md
  summary_path: reports/FINAL360M_ODOM360B_vs_old_backends_summary.md
  metrics_val_path: reports/FINAL360M_ODOM360B_metrics_val.json
  metrics_test_path: reports/FINAL360M_ODOM360B_metrics_test.json
  model_selection_table_path: reports/FINAL360M_ODOM360B_model_selection_table.json
  per_sequence_metrics_path: reports/FINAL360M_ODOM360B_per_sequence_metrics.json
  ablation_path: reports/FINAL360M_ODOM360B_pose_graph_ablation.json
  metric_source_manifest_path: reports/FINAL360M_ODOM360B_metric_source_manifest.json

data:
  image_hw: [384, 768]
  eval_batch_size: 8
  num_workers: 4
  require_paths: true
  skip_invalid: true
  tmag_epsilon: 1.0e-6
  export_all_pairs_for_k: [1, 2, 3]
  reuse_cache_if_present: true

evaluation:
  require_direct_reproduction_match: false
  require_odom360a_reproduction_match: false
  selection_score:
    ate_se3_weight: 1.0
    ate_sim3_weight: 2.0
    path_ratio_weight: 30.0
    degradation_penalty_weight: 5.0
  direct_reproduction_tolerance:
    ate_none_rmse: 1.0
    ate_se3_rmse: 1.0
    ate_sim3_rmse: 0.5
    trajectory_path_ratio: 0.05
  odom360a_reproduction_tolerance:
    ate_none_rmse: 1.0
    ate_se3_rmse: 1.0
    ate_sim3_rmse: 0.5
    trajectory_path_ratio: 0.05

search:
  methods:
    - method_name: pg_adjacent_only
      init_method: direct_composition
      k_max: 1
      k_decay: 1.0
      w_rot: 1.0
      w_tdir: 1.0
      w_tmag: 0.5
      w_smooth_rot: 0.0
      w_smooth_t: 0.0
      w_path: 0.0
      w_rot_prior: 0.0
      w_pos_prior: 0.0
      robust_delta: 1.0
      use_robust: false
      use_outlier_downweight: false
      iterations: 30
      lr: 0.01
      optimizer: adam
    - method_name: pg_k2
      init_method: direct_composition
      k_max: 2
      k_decay: 0.7
      w_rot: 1.0
      w_tdir: 1.0
      w_tmag: 0.5
      w_smooth_rot: 0.0
      w_smooth_t: 0.0
      w_path: 0.0
      w_rot_prior: 0.0
      w_pos_prior: 0.0
      robust_delta: 1.0
      use_robust: false
      use_outlier_downweight: false
      iterations: 40
      lr: 0.01
      optimizer: adam
    - method_name: pg_k2_robust
      init_method: direct_composition
      k_max: 2
      k_decay: 0.7
      w_rot: 1.0
      w_tdir: 1.0
      w_tmag: 0.5
      w_smooth_rot: 0.1
      w_smooth_t: 0.05
      w_path: 0.0
      w_rot_prior: 0.0
      w_pos_prior: 0.0
      robust_delta: 0.5
      use_robust: true
      use_outlier_downweight: true
      outlier_angle_deg: 120.0
      outlier_weight: 0.35
      iterations: 40
      lr: 0.005
      optimizer: adam
    - method_name: pg_k2_scale_rot_prior
      init_method: odom360a_selected
      k_max: 2
      k_decay: 0.7
      w_rot: 1.0
      w_tdir: 1.0
      w_tmag: 0.5
      w_smooth_rot: 0.1
      w_smooth_t: 0.05
      w_path: 0.05
      w_rot_prior: 0.2
      w_pos_prior: 0.1
      robust_delta: 0.5
      use_robust: true
      use_outlier_downweight: true
      outlier_angle_deg: 120.0
      outlier_weight: 0.35
      use_scale_pre_smoothing: ema
      scale_ema_alpha: 0.4
      use_rotation_pre_smoothing: ema
      rotation_strength: 0.2
      use_tdir_pre_suppression: true
      tdir_window: 3
      tdir_threshold_deg: 120.0
      tdir_replacement_strength: 0.25
      iterations: 50
      lr: 0.005
      optimizer: adam
    - method_name: pg_k3
      init_method: odom360a_selected
      k_max: 3
      k_decay: 0.5
      w_rot: 1.0
      w_tdir: 1.0
      w_tmag: 0.5
      w_smooth_rot: 0.1
      w_smooth_t: 0.05
      w_path: 0.05
      w_rot_prior: 0.2
      w_pos_prior: 0.1
      robust_delta: 0.5
      use_robust: true
      use_outlier_downweight: true
      outlier_angle_deg: 120.0
      outlier_weight: 0.35
      use_scale_pre_smoothing: ema
      scale_ema_alpha: 0.4
      use_rotation_pre_smoothing: ema
      rotation_strength: 0.2
      use_tdir_pre_suppression: true
      tdir_window: 3
      tdir_threshold_deg: 120.0
      tdir_replacement_strength: 0.25
      iterations: 40
      lr: 0.005
      optimizer: adam
