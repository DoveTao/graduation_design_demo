experiment: S5E13_real_correspondence_signed_direction_training
report_language: zh
scene: scene01
eval_seq: seq03
train_seqs:
  - seq01
  - seq02
timestamps: external_baselines/dataset/scene01_seq03/timestamps.txt
groundtruth: external_baselines/dataset/scene01_seq03/groundtruth_tum.txt
s5e12_feature_dir: external_baselines/results/s5e12_feature_gate
output_dir: external_baselines/results/s5e13_traceable_dense
weighted_dataset_json: checkpoints/S5E13_real_correspondence_signed_direction_candidate/correspondence_weighted_dataset.json
weighted_dataset_audit_json: checkpoints/S5E13_correspondence_weighted_dataset_audit.json
weighted_dataset_audit_report: reports/s5e13_correspondence_weighted_dataset_audit.md
candidate_checkpoint_json: checkpoints/S5E13_real_correspondence_signed_direction_candidate.json
training_status_json: checkpoints/S5E13_real_correspondence_signed_direction_candidate/training_status.json
report_md: reports/s5e13_real_correspondence_signed_direction_report.md
comparison_md: reports/s5e13_s5e12_s5e9_s5e6_to_s5e2_orbslam3_comparison.md

detector:
  type: ORB
  nfeatures: 1200
  fastThreshold: 12

matcher:
  ratio_test: 0.75
  cross_check: false

flow:
  enabled: true
  max_corners: 600
  quality_level: 0.01
  min_distance: 7
  win_size: 21
  max_level: 3

image:
  resized_width: 640
  resized_height: 320

weights:
  signed_reliable: 1.0
  signed_partial: 0.25
  signed_unobservable: 0.0
  signed_small_motion_multiplier: 0.25
  tdir_abs_reliable: 0.35
  tdir_abs_partial: 0.20
  tdir_abs_unobservable: 0.10
  tmag_default: 1.0
  tmag_near_static: 0.5
  rot_default: 1.0

observability:
  min_filtered_matches: 12
  min_inlier_matches: 8
  min_inlier_ratio: 0.20
  low_parallax_displacement: 2.0
  near_static_displacement: 0.75
  near_static_image_diff_mean: 0.02
  low_match_quantile: 0.20
  low_inlier_quantile: 0.25
  low_parallax_quantile: 0.25
  near_static_flow_quantile: 0.10
  near_static_diff_quantile: 0.10
  large_motion_gt_quantile: 0.75
  small_motion_gt_quantile: 0.25

model:
  hidden_dim: 128
  log_scale_clip: 0.8
  rot_delta_scale: 0.05
  dir_delta_scale: 0.35

train:
  device: cuda
  epochs: 40
  lr: 0.001
  weight_decay: 0.00001
  seed: 3407
  patience: 10

loss:
  w_rot: 0.05
  w_signed_tdir: 1.0
  w_tdir_abs_aux: 0.20
  w_anti_parallel: 0.20
  w_tmag: 0.50
  w_tmag_p95_penalty: 0.20
  w_path_length_consistency: 0.10
  w_short_window_direction_consistency: 0.05
  w_smoothness: 0.05

caveats:
  - S5E13 是 experimental candidate，不替代 official S5 locked result。
  - strict essential geometry 仍受 equirectangular 相机和 pinhole intrinsics 缺失限制。
  - unobservable edges 不能强 signed direction supervision。
  - scene01/seq03 GT 只用于 evaluation / diagnostics，不用于训练。
