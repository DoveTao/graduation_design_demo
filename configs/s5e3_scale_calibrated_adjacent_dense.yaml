experiment: S5E3_scale_calibrated_adjacent_dense_candidate
status:
  experimental_candidate: true
  not_official_replacement: true
  official_s5_locked_metrics_unchanged: true

data:
  data_root: data
  split_by: scene_seq
  train_ratio: 0.8
  split_seed: 3407
  train_sequences:
    - scene01/seq01
    - scene01/seq02
  eval_sequence: scene01/seq03
  uses_scene01_seq03_for_training: false
  no_gt_leakage: true
  no_restored_dense_artifact_for_prediction: true

base_candidate:
  s5e2_checkpoint_dir: checkpoints/S5E2_adjacent_dense_candidate
  inherit_rotation_from_s5e2: true

model:
  strategy: multi_head_adjacent_regressor
  backbone: minimal_image_statistics
  rotation_head: inherited_s5e2
  translation_direction_head: ridge_unit_direction
  translation_magnitude_head: ridge_log_magnitude
  ridge_lambda_direction: 0.001
  ridge_lambda_magnitude: 0.001
  magnitude_clip_train_quantiles: [0.01, 0.99]

losses:
  so3_geodesic: true
  tdir: true
  tmag_log: true
  path_length_consistency: true
  short_window_consistency: true
  adjacent_scale_smoothness: true
  small_translation_mask: 0.001

geometry_gate:
  rot_mean_deg_max: 2.0
  tmag_median_ratio_max: 5.0
  path_ratio_max: 1.5
  tdir_mean_deg_target: 45.0
  tdir_abs_mean_deg_target: 35.0
  sim3_ate_must_improve_vs_s5e2: true

caveats:
  - S5E3 is experimental and does not replace official S5 locked result.
  - S5 locked metrics/policy unchanged.
  - scene01/seq03 GT is used only for evaluation / diagnostics.
  - No restored dense artifact is used to generate prediction.
