# exported dataset is equirectangular panorama data and the current export
# does not provide a trustworthy pinhole or fisheye calibration.

orbslam3_ready: false
reason: "Dataset export is panorama/equirectangular; ORB-SLAM3 monocular expects pinhole or fisheye camera calibration."

dataset:
  sequence: scene01/seq03
  image_list: external_baselines/dataset/scene01_seq03/image_list.txt
  timestamps: external_baselines/dataset/scene01_seq03/timestamps.txt
  groundtruth_tum: external_baselines/dataset/scene01_seq03/groundtruth_tum.txt

camera:
  model: equirectangular_panorama
  width: 2048
  height: 1024
  fx: null
  fy: null
  cx: null
  cy: null
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  fps: null

notes:
  - "Do not fabricate pinhole intrinsics for a fair baseline comparison."
  - "A projection adapter or a separately calibrated perspective/fisheye export would be required before a valid ORB-SLAM3 run."
